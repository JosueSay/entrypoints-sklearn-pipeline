[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-paso-extra"
version = "0.1.0"
description = "Agrega un paso al grupo pipeline.steps sin modificar el paquete principal"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."pipeline.steps"]
25-varianza = "pipeline_extra.pasos:varianza"
